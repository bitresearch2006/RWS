{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow p-4">
      <h3 class="mb-3 text-center">Register</h3>
      <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" name="dob" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone1" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Phone</label>
          <input type="text" name="phone2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>

      <hr class="my-4">

      <div class="text-center">
        <a href="{{ url_for('google.login') }}" class="btn btn-danger w-100">
          <i class="bi bi-google"></i> Sign in with Google
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
