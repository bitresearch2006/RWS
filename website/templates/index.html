<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(to right, #e3ffe7, #d9e7ff);
    }
    .navbar {
      background-color: #0c2d48;
    }
    .card {
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .service-list {
      margin-top: 90px;
    }
    .search-input {
      max-width: 400px;
      margin: 0 auto 30px;
    }
    .service-icon {
      font-size: 2rem;
      color: #0c2d48;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/home">Microservices</a>
    <div>
      <a class="nav-link d-inline text-white" href="/home">Home</a>
      <a class="nav-link d-inline text-white" href="/services">Services</a>
      <a class="nav-link d-inline text-white" href="/login">Login</a>
      <a class="nav-link d-inline text-white" href="/contact">Contact</a>
      <a class="nav-link d-inline text-white" href="/about">About</a>
      <a class="nav-link d-inline text-white" href="/guidelines">Guidelines</a>
    </div>
  </div>
</nav>

<!-- Service Section -->
<div class="container service-list animate__animated animate__fadeInUp">
  <h2 class="text-center mb-4">Available GitHub Services</h2>

  <div class="search-input mb-4">
    <input id="searchBox" type="text" class="form-control" placeholder="Search services...">
  </div>

  <div class="row" id="serviceCards">
    {% for service in services %}
<div class="col-md-4 mb-4 service-card">
  <div class="card bg-light shadow animate__animated animate__zoomIn">
    <div class="card-body text-center">
      <i class="fas {{ service.icon }} service-icon mb-3"></i>
      <h5 class="card-title">{{ service.name }}</h5>
      <p class="card-text">Click below to explore full documentation of this microservice.</p>
      <a href="/service/{{ service.name }}" class="btn btn-primary">View Service</a>
    </div>
  </div>
</div>

    {% endfor %}
  </div>
</div>

<script>
  const searchBox = document.getElementById("searchBox");
  const cards = document.querySelectorAll(".service-card");

  searchBox.addEventListener("keyup", function() {
    const searchText = this.value.toLowerCase();
    cards.forEach(card => {
      const title = card.querySelector(".card-title").textContent.toLowerCase();
      card.style.display = title.includes(searchText) ? "block" : "none";
    });
  });
</script>

</body>
</html>
