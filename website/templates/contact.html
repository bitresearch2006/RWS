<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5 animate__animated animate__fadeIn">
  <h2 class="text-center mb-4">Contact Us</h2>
  <p class="text-center mb-4">We’d love to hear from you! Use the form below to reach us with your queries, suggestions, or issues.</p>

  <form class="mx-auto" style="max-width: 600px;">
    <div class="mb-3">
      <label>Name</label>
      <input type="text" class="form-control" placeholder="Your name">
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" placeholder="you@example.com">
    </div>
    <div class="mb-3">
      <label>Message</label>
      <textarea class="form-control" rows="5" placeholder="Write your message here..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send Message</button>
    <a href="/home" class="btn btn-secondary ms-2">Back to Home</a>
  </form>
</div>

</body>
</html>
